<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
        <defs>
                <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#232e3d" />
                        <stop offset="0.5" stop-color="#2c3a4d" />
                        <stop offset="1" stop-color="#1c2532" />
                </linearGradient>
                <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.85" />
                        <stop offset="1" stop-color="#1f6feb" stop-opacity="0.55" />
                </linearGradient>
        </defs>

        <!-- suelo -->
        <rect x="20" y="196" width="280" height="6" rx="3" fill="#0a0e14" stroke="#2a3542" />

        <!-- patas -->
        <rect x="74" y="168" width="12" height="30" fill="#3d4c5e" />
        <rect x="234" y="168" width="12" height="30" fill="#3d4c5e" />

        <!-- tanque -->
        <rect x="60" y="70" width="200" height="110" rx="26" fill="url(#tank)" stroke="#3d4c5e" stroke-width="2" />

        <!-- líquido interior -->
        <path d="M70 118 h180 v46 a20 20 0 0 1 -20 20 H90 a20 20 0 0 1 -20 -20 Z" fill="url(#liquid)" opacity="0.75" />
        <path d="M70 118 q22 -8 45 0 t45 0 t45 0 t45 0" fill="none" stroke="#8ec5ff" stroke-width="2" opacity="0.9" />

                <!-- agitador -->
        <rect x="156" y="44" width="8" height="104" rx="3" fill="#8b98a9" />
        <rect x="128" y="132" width="64" height="9" rx="4" fill="#5c6b7e" />
        <rect x="136" y="141" width="10" height="22" rx="4" fill="#5c6b7e" />
        <rect x="174" y="141" width="10" height="22" rx="4" fill="#5c6b7e" />

        <!-- motor -->
        <rect x="134" y="24" width="52" height="26" rx="6" fill="#2c3a4d" stroke="#3d4c5e" stroke-width="2" />
        <rect x="186" y="30" width="12" height="14" rx="3" fill="#4aa3ff" />

                <!-- puerta frontal -->
        <circle cx="160" cy="140" r="22" fill="#0a0e14" stroke="#3d4c5e" stroke-width="2" />
        <circle cx="160" cy="140" r="6" fill="#4aa3ff" />

        <!-- etiqueta -->
        <rect x="96" y="84" width="52" height="16" rx="4" fill="#0a0e14" stroke="#2a3542" />
        <text x="122" y="96" font-family="monospace" font-size="10" fill="#8b98a9" text-anchor="middle">MX-01</text>
</svg>
